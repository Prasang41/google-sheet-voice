<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Google Sheets Voice Input</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <header class="header">

      <div class="logo">
        🎤
      </div>

      <div>
        <h1>Voice Input</h1>
        <p>Google Sheets voice entry</p>
      </div>

    </header>


    <section class="target-card">

      <span class="target-label">
        CURRENT CELL
      </span>

      <strong id="targetCell">
        Detecting...
      </strong>

    </section>


    <section class="status-card">

      <div
        id="statusDot"
        class="status-dot"
      ></div>

      <div>
        <strong id="status">
          Ready
        </strong>

        <p id="statusDescription">
          Click Start and speak naturally.
        </p>
      </div>

    </section>


    <section class="transcript-card">

      <label for="transcript">
        Recognized text
      </label>

      <textarea
        id="transcript"
        placeholder="Your speech will appear here..."
        readonly
      ></textarea>

    </section>


    <section class="controls">

      <button
        id="startButton"
        class="primary-button"
        type="button"
      >
        🎤 Start
      </button>

      <button
        id="stopButton"
        class="stop-button"
        type="button"
        disabled
      >
        ■ Stop
      </button>

    </section>


    <div
      id="browserWarning"
      class="warning hidden"
    ></div>


    <div
      id="connectionStatus"
      class="connection-status"
    >
      Connecting to Google Sheet...
    </div>

  </main>

  <script src="script.js"></script>

</body>
</html>
